packages:
  - '.'
allowBuilds:
  esbuild: true
# Install the native dforge-cli binary for the current machine only, and always install it
# (it is an optional dependency, so a silent skip leaves a launcher with no binary).
supportedArchitectures:
  os: [current]
  cpu: [current]
# Our own scope is published by us; do not hold its releases back by age.
minimumReleaseAgeExclude:
  - '@dforge-core/*'
