name: publish

# Publishes @dforge-core/dforge-mcp to npm using npm Trusted Publisher (OIDC).
#
# Automatic:
#   Push to main -> reads version from package.json -> publishes if that
#   version does not already exist on npm.
#
# Manual:
#   gh workflow run publish.yml \
#     --repo dforge-core/dforge-mcp \
#     -f npm_version=0.1.0-rc.7 \
#     -f npm_tag=next

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      npm_version:
        description: 'npm version to publish, e.g. 0.1.0-rc.7'
        required: true
        type: string

      npm_tag:
        description: 'npm dist-tag (latest / next / etc.)'
        required: false
        type: string
        default: 'latest'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Determine package name, version and npm tag.
      - name: Determine publish information
        id: publish_info
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.npm_version }}"
            TAG="${{ inputs.npm_tag }}"
          else
            VERSION="$PACKAGE_VERSION"
            TAG="latest"
          fi

          echo "package=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "Package: $PACKAGE_NAME"
          echo "Version: $VERSION"
          echo "Tag: $TAG"

      # Do not attempt to publish a version that already exists on npm.
      - name: Check whether version already exists
        id: version_check
        shell: bash
        run: |
          PACKAGE="${{ steps.publish_info.outputs.package }}"
          VERSION="${{ steps.publish_info.outputs.version }}"

          if npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE}@${VERSION} already exists on npm."
            echo "Skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE}@${VERSION} does not exist on npm."
            echo "Publishing is required."
          fi

      # Don't install/build anything if this version is already published.
      - name: Install dev dependencies
        if: steps.version_check.outputs.exists != 'true'
        run: pnpm install --ignore-scripts --no-frozen-lockfile

      - name: Publish to npm
        if: steps.version_check.outputs.exists != 'true'
        run: |
          scripts/publish.sh \
            "${{ steps.publish_info.outputs.version }}" \
            --tag "${{ steps.publish_info.outputs.tag }}" \
            --yes